spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/modular_bank
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:finbank}
    password: ${RABBITMQ_PASSWORD:finbank}
    dynamic: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2
          max-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

jwt:
  secret: ${JWT_SECRET:modular-bank-dev-secret-change-in-production-256bit}
  access-expiration-minutes: 15
  refresh-expiration-days: 7

server:
  port: ${SERVER_PORT:8082}

accounts:
  client:
    mode: ${ACCOUNTS_CLIENT_MODE:remote}
    base-url: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}
    internal-api-key: ${INTERNAL_API_KEY:finbank-internal-dev-key}
