spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: accounts-service
          uri: http://localhost:8081
          predicates:
            - Path=/accounts,/accounts/**

        - id: transfers-service
          uri: http://localhost:8083
          predicates:
            - Path=/transfers,/transfers/**

        - id: modular-monolith
          uri: http://localhost:8082
          predicates:
            - Path=/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway