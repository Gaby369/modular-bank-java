spring:
  application:
    name: accounts-service

  datasource:
    url: ${ACCOUNTS_DB_URL:jdbc:postgresql://localhost:5433/accounts_db}
    username: ${ACCOUNTS_DB_USER:accounts}
    password: ${ACCOUNTS_DB_PASSWORD:accounts}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:finbank}
    password: ${RABBITMQ_PASSWORD:finbank}
    dynamic: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2
          max-interval: 5s

jwt:
  secret: ${JWT_SECRET:modular-bank-dev-secret-change-in-production-256bit}

server:
  port: 8081

internal:
  api-key: ${INTERNAL_API_KEY:finbank-internal-dev-key}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: accounts-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-none}] %logger{36} - %msg%n"
