spring:
  application:
    name: accounts-service

  datasource:
    url: ${ACCOUNTS_DB_URL:jdbc:postgresql://localhost:5433/accounts_db}
    username: ${ACCOUNTS_DB_USER:accounts}
    password: ${ACCOUNTS_DB_PASSWORD:accounts}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:modular-bank-dev-secret-change-in-production-256bit}

server:
  port: 8081